<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo KLAN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 50px;
        }
        h1 { color: #333; }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover { background-color: #ff6b81; }
        #status {
            margin-top: 20px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Radyo KLAN</h1>
    <p>WePlay tarzı canlı 2 kişilik sesli bilgi yarışması</p>
    
    <button class="btn" id="startBtn">YENİ OYUN</button>
    <div id="status"></div>

    <!-- Socket.IO Kütüphanesi -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');

        startBtn.addEventListener('click', () => {
            statusDiv.innerText = 'Rastgele rakip aranıyor...';
            startBtn.style.display = 'none';
            socket.emit('find-match');
        });

        socket.on('waiting', (msg) => {
            statusDiv.innerText = msg;
        });

        socket.on('match-found', (data) => {
            statusDiv.innerText = 'Rakip bulundu! Oyun başlıyor... (Oda ID: ' + data.roomId + ')';
        });
    </script>

</body>
</html>
