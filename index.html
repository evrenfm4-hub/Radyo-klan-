<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radyo KLAN - Canlı & Fal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0b0f19;
            color: white;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #111827;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #1f2937;
        }
        h2 { color: #f3f4f6; margin-bottom: 5px; }
        .status { color: #10b981; font-weight: bold; margin-bottom: 12px; font-size: 14px; }
        
        #chatBox {
            width: 100%;
            height: 240px;
            background-color: #030712;
            border: 1px solid #374151;
            border-radius: 8px;
            margin-bottom: 12px;
            padding: 10px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            box-sizing: border-box;
        }
        .chat-message {
            margin-bottom: 8px;
            padding: 8px 10px;
            background: #1e293b;
            border-radius: 6px;
            word-break: break-all;
        }
        .fal-message {
            margin-bottom: 8px;
            padding: 10px;
            background: #3b0764;
            border: 1px solid #9333ea;
            border-radius: 8px;
            color: #f3e8ff;
            text-align: left;
            line-height: 1.4;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #030712;
            color: white;
            outline: none;
        }
        .btn-green {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-purple {
            background-color: #9333ea;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-purple:hover { background-color: #7e22ce; }
        .btn-blue {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-blue:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <h2>RADYO KLAN</h2>
        <div class="status">🟢 Canlı Sohbet & Fal Sistemi Aktif</div>

        <!-- Sohbet ve Fal Mesajları Ekranı -->
        <div id="chatBox">
            <div class="chat-message"><b>Sistem:</b> Sohbete hoş geldin Evren! Canlı mesajlaşma ve fal özelliklerin hazır.</div>
        </div>

        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Mesaj yaz...">
            <button class="btn-green" id="sendBtn">Gönder</button>
        </div>

        <!-- İstediğin Fal Butonları -->
        <button class="btn-purple" id="buyFalBtn">☕ Yapay Zeka Falı Satın Al (10 Altın)</button>
        <button class="btn-blue" id="oldFalsBtn">📜 Geçmiş Fallarım</button>
    </div>

    <!-- Socket.IO Kütüphanesi -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const buyFalBtn = document.getElementById('buyFalBtn');
        const oldFalsBtn = document.getElementById('oldFalsBtn');
        const myName = 'Evren';

        // --- SOHBET SİSTEMİ ---
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                socket.emit('chat-message', {
                    message: text,
                    sender: myName
                });
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        socket.on('chat-message', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-message';
            msgDiv.innerHTML = `<b>${data.sender}:</b> ${data.message}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // --- FAL SİSTEMİ VE GEÇMİŞİ ---
        function saveFalToStorage(falText) {
            let fals = JSON.parse(localStorage.getItem('eski_fallar') || '[]');
            fals.push({ date: new Date().toLocaleString(), text: falText });
            localStorage.setItem('eski_fallar', JSON.stringify(fals));
        }

        buyFalBtn.addEventListener('click', () => {
            const siraDiv = document.createElement('div');
            siraDiv.className = 'fal-message';
            siraDiv.innerHTML = `🔮 <b>Yapay Zeka Falcısı:</b> Kahve falınız sıraya alındı. 5 saniye içinde yorumlanıp buraya düşecek...`;
            chatBox.appendChild(siraDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const falIcerigi = `Fincanınızda büyük bir yol ve yolun sonunda ellerini açmış bekleyen bir insan silüeti çıkmış. Uzun zamandır beklediğiniz haber yakında gelecek. Tabakta ise temiz bir para ve kısmet var!`;
                
                const sonucDiv = document.createElement('div');
                sonucDiv.className = 'fal-message';
                sonucDiv.style.background = '#581c87';
                sonucDiv.style.borderColor = '#c084fc';
                sonucDiv.innerHTML = `✨ <b>Falınız Yorumlandı!</b><br><br>${falIcerigi}`;
                
                chatBox.appendChild(sonucDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                saveFalToStorage(falIcerigi);
            }, 5000);
        });

        // Eski falları listeleme
        oldFalsBtn.addEventListener('click', () => {
            let fals = JSON.parse(localStorage.getItem('eski_fallar') || '[]');
            
            chatBox.innerHTML = ''; 
            
            if (fals.length === 0) {
                chatBox.innerHTML = `<div class="fal-message">📜 Henüz geçmiş fal kaydınız bulunmuyor.</div>`;
                return;
            }

            const headerDiv = document.createElement('div');
            headerDiv.className = 'fal-message';
            headerDiv.style.background = '#1e1b4b';
            headerDiv.innerHTML = `<b>📜 Geçmiş Fallarınız (${fals.length} Adet):</b>`;
            chatBox.appendChild(headerDiv);

            fals.forEach((fal, index) => {
                const falDiv = document.createElement('div');
                falDiv.className = 'fal-message';
                falDiv.innerHTML = `<b>#${index + 1} - ${fal.date}</b><br>${fal.text}`;
                chatBox.appendChild(falDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
